<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tickets</title>
<!-- the tab icon: a board, three lanes of cards, and the green "agent working" dot -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230052cc'/><g fill='%23fff'><rect x='5' y='6' width='6' height='5' rx='1.5'/><rect x='5' y='13' width='6' height='5' rx='1.5'/><rect x='5' y='20' width='6' height='5' rx='1.5'/><rect x='13' y='6' width='6' height='5' rx='1.5'/><rect x='13' y='13' width='6' height='5' rx='1.5'/><rect x='21' y='6' width='6' height='5' rx='1.5'/></g><circle cx='24' cy='21' r='4.5' fill='%2336b37e' stroke='%230052cc' stroke-width='1.5'/></svg>">
<style>
  :root {
    --bg: #f4f5f7; --panel: #fff; --line: #dcdfe4; --ink: #172b4d; --dim: #6b778c;
    --accent: #0052cc; --warn: #bf2600;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 5;
  }
  header h1 { font-size: 16px; margin: 0 8px 0 0; letter-spacing: .5px; }
  label.f { color: var(--dim); font-size: 12px; }
  select, input, textarea, button {
    font: inherit; color: inherit; background: #fff;
    border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px;
  }
  button { cursor: pointer; background: #fafbfc; }
  button:hover { background: #ebecf0; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .spacer { flex: 1; }
  header a { color: var(--accent); }
  /* the project tabs: one line that scrolls sideways inside itself when it runs out of room */
  #proj { display: flex; gap: 2px; overflow-x: auto; min-width: 0; max-width: 100%;
          position: relative; }   /* the tabs' offsetLeft is measured from the strip */
  #proj button { border: 0; border-bottom: 3px solid transparent; border-radius: 0;
                 background: none; padding: 4px 10px 3px; white-space: nowrap; color: var(--dim);
                 display: flex; align-items: center; gap: 6px; }
  #proj button:hover { background: #ebecf0; }
  #proj button[aria-selected=true] { color: var(--ink); font-weight: 600;
                                     border-bottom-color: var(--accent); }
  #proj .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  /* #82: a tab's dot pulses while an agent works a card in it. "All" and a project with no
     color get a neutral dot that shows only while lit; markTab lights it in place */
  #proj .dot.idle { background: #97a0af; }
  #proj .dot.idle:not(.working) { display: none; }
  #proj .dot.working { animation: pulse 1.2s infinite; }

  #err {   /* fixed above everything, the open editor included */
    display: none; padding: 8px 16px; background: #ffebe6; color: var(--warn);
    border-bottom: 1px solid #ffbdad; cursor: pointer;
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
  }
  #err.on { display: block; }

  /* the board fills the window below the header, and every lane runs to its bottom */
  body { display: flex; flex-direction: column; min-height: 100vh; }
  #board { display: flex; gap: 12px; padding: 16px; align-items: stretch; overflow-x: auto;
           flex: 1; }
  .lane {
    flex: 1 1 0; min-width: 150px; background: #ebecf0; border-radius: 6px;
    padding: 8px; display: flex; flex-direction: column; gap: 8px; min-height: 120px;
  }
  .lane.over { background: #d8e4fb; outline: 2px dashed var(--accent); }
  .lane h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--dim); margin: 0; display: flex; justify-content: space-between;
  }
  .card {
    background: var(--panel); border-radius: 4px; padding: 8px 10px; cursor: pointer;
    box-shadow: 0 1px 1px rgba(9,30,66,.25);
  }
  .card:hover { background: #f7f8f9; }
  .card { position: relative; }
  .card.dragging { opacity: .4; }
  .card { user-select: none; }   /* shift-click selects cards, not text */
  .card.selected { outline: 2px solid var(--accent); }
  body:has(.card.dragging.selected) .card.selected { opacity: .4; }  /* all of them go */
  .card .t { font-weight: 500; }
  .card .meta { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
                font-size: 11px; color: var(--dim); }
  /* archive all in the done header: small, quiet, on the right */
  .lane h2 .arch { margin: 0 6px 0 auto; font-size: 11px; padding: 0 6px; cursor: pointer;
                   text-transform: none; letter-spacing: normal; }
  /* the line a dragged card would drop above */
  .card.drop-at { box-shadow: inset 0 3px 0 var(--accent); }
  .pill { background: #dfe1e6; border-radius: 10px; padding: 1px 7px; font-size: 11px; color: #42526e; }
  .pill.who { background: #deebff; color: #0747a6; }
  /* blocked red, blocking amber: a stripe down the left edge (not box-shadow, which
     .drop-at uses, nor outline, which .selected uses) and a pill naming the other cards */
  .card.blocked::before, .card.blocking::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
    border-radius: 4px 0 0 4px; background: #ff991f;
  }
  .card.blocked::before { background: var(--warn); }
  .card.blocked.blocking::before { background: linear-gradient(var(--warn) 50%, #ff991f 50%); }
  .pill.blocked-by { background: #ffebe6; color: var(--warn); }
  .pill.blocks { background: #fffae6; color: #974f0c; }
  /* #37: an arrow from each blocking card to each card it blocks, both on screen. One svg
     over the whole board, in its scroll coordinates, so it scrolls with it; clicks and
     drags go through. Faint, so many links don't drown the cards; a hovered card's are lit */
  #board { position: relative; }
  #links { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
  #links > path { fill: none; stroke: #ff991f; stroke-width: 2; opacity: .3; }
  #links > path.hot { opacity: 1; }
  #links marker path { fill: #ff991f; }   /* the line's amber: one arrow, not a red tag */
  .card { z-index: 1; }   /* over the arrows: one crossing a card goes under it, not over its text */
  /* shown only when lit: the work dot pulses green while an agent works the card. It stays
     in the DOM when idle, so markWorking can light it without a re-render */
  .work, .st { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .work:not(.working) { display: none; }
  .work.working { background: #36b37e; animation: pulse 1.2s infinite; }
  /* on the base branch, deployed: set by the agent, so not clickable */
  .st.merged { background: #0052cc; }
  .st.deployed { background: #6554c0; }
  #panel .head .work.working, #panel .head .st { display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: middle; }
  .pill.proj { font-weight: 600; }
  #panel .project input[type=color] { width: 60px; height: 28px; padding: 2px; }
  .id { color: #a5adba; }

  #panel {
    /* above the sticky header (z-index 5): below it, the panel's own close button sat
       under the header and every click on it hit "Add to todo" instead */
    position: fixed; inset: 5%; z-index: 10;   /* a margin of board all round: click it to close */
    background: var(--panel); overflow-y: auto; padding: 16px 20px 40px; display: none;
    border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 8px 24px rgba(9,30,66,.25);
  }
  #panel.on { display: block; }
  #panel h3 { margin: 14px 0 6px; font-size: 11px; text-transform: uppercase;
               letter-spacing: .08em; color: var(--dim); }
  #panel .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #panel input[type=text], #panel textarea, #panel select { width: 100%; }
  #panel textarea { min-height: 70px; resize: vertical; }
  /* grows with its text, natively: 10 lines at least, 50 at most, then it scrolls */
  #panel textarea.desc { field-sizing: content; box-sizing: content-box;
                         min-height: 10lh; max-height: 50lh; width: calc(100% - 14px); }
  /* the plan is long: a fixed 10 lines that scrolls, not sized by its text */
  #panel textarea.plan { height: 10lh; }
  #panel .project { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  #panel .project button { align-self: flex-start; }
  .close { float: right; margin-left: 10px; }   /* the gap between neighbouring buttons */
  /* the card's header row stays put while the sheet scrolls under it: number, title,
     archive, close. The negative margin cancels the sheet's padding */
  #panel .head { position: sticky; top: -16px; z-index: 1; display: flex; gap: 10px;
                 align-items: center; margin: -16px -20px 8px; padding: 12px 20px;
                 background: var(--panel); border-bottom: 1px solid var(--line); }
  #panel .head input { flex: 1; min-width: 0; font-size: 16px; font-weight: 600; }
  .sub { color: var(--dim); font-size: 12px; }
  .sub .ses { font-size: 11px; padding: 0 6px; color: inherit; }

  .log { list-style: none; margin: 0; padding: 0; }
  .log li { padding: 6px 0; border-top: 1px solid #f0f1f4; }
  .log .who { font-weight: 600; }
  .log .when { color: #a5adba; font-size: 11px; margin-left: 4px; }
  .log .say { display: block; margin-top: 2px; white-space: pre-wrap; }
  .log li.comment { background: #f7f8fc; border-radius: 4px; padding: 6px 8px; }
  /* what claude printed while it worked: a terminal, closed until you want it */
  .log .cli { margin-top: 6px; }
  .log .cli summary { color: var(--dim); font-size: 12px; cursor: pointer; }
  .log .cli pre { margin: 4px 0 0; padding: 6px 8px; border-radius: 4px;
                  background: #1f2430; color: #e6e6e6; font-size: 12px; line-height: 1.4;
                  max-height: 24lh; overflow: auto; white-space: pre-wrap;
                  overflow-wrap: anywhere; }
  .log:not(.open) li.old { display: none; }
  .log li.more { border-top: 0; }
  /* an open question's options: one row of radios per question, under the questions box */
  .choice { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; margin: 4px 0; }
  .chk { display: flex; gap: 6px; align-items: baseline; }
  .chk.done span { text-decoration: line-through; color: var(--dim); }
  .links li { list-style: none; display: flex; gap: 6px; align-items: center; }
  ul.links { padding: 0; margin: 0; }

  body { padding-bottom: 36px; }   /* room for the status bar over the board's last cards */
  #status {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    display: flex; gap: 16px; flex-wrap: wrap; align-items: center;
    padding: 6px 16px; font-size: 12px; color: var(--dim);
    background: var(--panel); border-top: 1px solid var(--line);
  }
  #status .job { cursor: pointer; }
  #status .job:hover .t { text-decoration: underline; }
  #status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
                 background: #36b37e; margin-right: 6px; animation: pulse 1.2s infinite; }
  #status .who, #status .t { color: var(--ink); font-weight: 600; }
  @keyframes pulse { 50% { opacity: .3; } }

  button.danger { background: var(--warn); color: #fff; border-color: var(--warn); }
  #delProject { max-width: 440px; border: 1px solid var(--line); border-radius: 6px;
                box-shadow: 0 8px 24px rgba(9,30,66,.25); }
  /* the board settings sheet */
  #panel .setting { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  #panel .setting .warn { color: var(--warn); font-size: 12px; margin: 0; }
  #panel .setting .state { margin: 0; }
  #panel .setting ul { margin: 0; padding-left: 20px; }
  #delProject h3 { margin: 0 0 8px; }
  #delProject .row { display: flex; gap: 8px; justify-content: flex-end; }
</style>
</head>
<body>

<header>
  <h1>Tickets</h1>
  <nav id="proj" role="tablist" aria-label="project"></nav>
  <button id="projects">projects…</button>
  <button id="settings">settings…</button>
  <label class="f"><input type="checkbox" id="showArch"> show archived</label>
  <a id="docs" href="/docs" target="_blank">docs</a>
  <span class="spacer"></span>
  <button class="primary" id="add">New Card</button>
</header>

<div id="err"></div>
<div id="board"></div>
<div id="panel"></div>
<footer id="status"></footer>
<dialog id="delProject">
  <form method="dialog">
    <h3 id="delTitle"></h3>
    <p id="delMsg"></p>
    <div class="row">
      <button value="cancel" autofocus>Cancel</button>
      <button value="delete" class="danger">Delete project</button>
    </div>
  </form>
</dialog>

<script>
const LANES = ["todo", "plan", "develop", "test", "verify", "done"];
const $ = (s, r = document) => r.querySelector(s);

let cards = [];      // current board (filtered)
let users = [];
let projects = [];   // configured projects: {name, path, instructions}
const PROJECTS = "projects";   // `open` holds this while the panel shows project settings
const SETTINGS = "settings";   // ... and this while it shows the board settings
let open = null;     // full card (with events/links) shown in the panel
const selected = new Set();   // card ids picked with ctrl/shift-click, moved together
let anchor = null;            // the card a shift-click selects from

// ---------- plumbing ----------
function showErr(msg) {
  const e = $("#err");
  e.textContent = msg;
  e.classList.add("on");
  clearTimeout(showErr.t);
  showErr.t = setTimeout(() => e.classList.remove("on"), 8000);
}
$("#err").onclick = () => $("#err").classList.remove("on");

async function api(method, path, body) {
  const opts = { method, headers: { "Content-Type": "application/json" } };
  if (body) opts.body = JSON.stringify(path.startsWith("/api/projects") ? body
                                                                         : { ...body, actor: USER });
  const r = await fetch(path, opts);
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || (r.status + " " + r.statusText));
  return data;
}

const USER = "User";   // the one person; a settings-chosen name can replace this later
const proj = () => localStorage.getItem("project") || "";

function ago(iso) {
  const d = new Date(iso), s = (Date.now() - d) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  if (s < 7 * 86400) return Math.floor(s / 86400) + "d ago";
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

// ---------- activity log ----------
// `from`/`to` carry real values: labels/checklist are arrays, assignee can be null.
function val(v) {
  if (Array.isArray(v)) return v.length ? v.join(", ") : "nothing";
  if (v === null || v === undefined || v === "") return "nothing";
  return String(v);
}

function eventLine(e) {
  const d = e.detail || {};
  switch (e.kind) {
    case "created":  return `created this in ${val(d.lane)}`;
    case "moved":    return `moved it from ${val(d.from)} to ${val(d.to)}`;
    case "assigned": return d.to ? `assigned it to ${val(d.to)}`
                                 : `unassigned it (was ${val(d.from)})`;
    case "edited":
      if (["description", "plan", "questions", "answers"].includes(d.field))
        return `edited the ${d.field}`;
      if (d.field === "checklist")   return `changed the checklist to ${val(d.to)}`;
      if (d.field === "labels")      return `changed the labels from ${val(d.from)} to ${val(d.to)}`;
      return `changed the ${d.field} from ${val(d.from)} to ${val(d.to)}`;
    case "checked":  return `${d.done ? "ticked" : "unticked"} “${d.text}”`;
    case "linked":   return `linked this as a ${d.kind} of #${d.to}`;
    case "unlinked": return `removed the ${d.kind} link to #${d.to}`;
    case "archived": return d.to ? "archived it" : "unarchived it";
    default:         return e.kind;
  }
}

// Left out of the log: what the dots, the session button and the PR link already show,
// and an agent taking or dropping a card itself ("claude-agent unassigned it (was
// claude-agent)").
function bookkeeping(e) {
  const d = e.detail || {};
  if (e.kind === "edited") return ["merged", "deployed", "session", "pr"].includes(d.field);
  if (e.kind === "assigned") return (d.to || d.from) === e.actor;
  return false;
}

// The agent's comment carries the transcript of the run that wrote it: a <details> box,
// closed, so the comment still reads as one line until you want the whole run.
const cliOpen = new Set();   // event ids whose box is open: survives a panel re-render
function cliBox(e) {
  const d = document.createElement("details");
  d.className = "cli";
  d.open = cliOpen.has(e.id);
  d.append(Object.assign(document.createElement("summary"), { textContent: "claude's output" }),
           Object.assign(document.createElement("pre"), { textContent: e.detail.output }));
  d.ontoggle = () => d.open ? cliOpen.add(e.id) : cliOpen.delete(e.id);
  return d;
}

// Everything older than the last comment by someone else (the agent) is folded away
// behind one button: opening a worked card should not mean scrolling past its history.
// No such comment -- the agent has not spoken yet -- and only the newest line stays.
function renderLog(events) {
  events = events.filter(e => !bookkeeping(e));
  const ul = document.createElement("ul");
  ul.className = "log";
  if (logOpen) ul.classList.add("open");
  let cut = events.length - 1;
  events.forEach((e, i) => { if (e.kind === "comment" && e.actor !== USER) cut = i; });
  events.forEach((e, i) => {
    const li = document.createElement("li");
    if (i < cut) li.classList.add("old");
    const actor = document.createElement("span");
    actor.className = "who"; actor.textContent = e.actor;
    const when = document.createElement("span");
    when.className = "when"; when.textContent = ago(e.at); when.title = e.at;
    li.append(actor);
    if (e.kind === "comment") {
      li.classList.add("comment");
      li.append(document.createTextNode(" "), when);
      const say = document.createElement("span");
      say.className = "say"; say.textContent = e.detail.text;
      li.append(say);
      if (e.detail.output) li.append(cliBox(e));
    } else {
      li.append(document.createTextNode(" " + eventLine(e)), when);
    }
    ul.append(li);
  });
  if (cut > 0) {
    const btn = document.createElement("button");
    const label = () => {
      btn.textContent = logOpen ? "hide earlier" : `show ${cut} earlier`;
      btn.setAttribute("aria-expanded", logOpen);
    };
    btn.onclick = () => { logOpen = !logOpen; ul.classList.toggle("open", logOpen); label(); };
    label();
    const li = Object.assign(document.createElement("li"), { className: "more" });
    li.append(btn);
    ul.prepend(li);
  }
  if (!events.length) ul.append(Object.assign(document.createElement("li"),
    { className: "sub", textContent: "nothing yet" }));
  return ul;
}

// ---------- board ----------
const projectColor = name => projects.find(p => p.name.toLowerCase() === name.toLowerCase())?.color;

// The card's project, in the project's color. Text goes dark on a light color.
function projectTag(name) {
  const tag = Object.assign(document.createElement("span"),
    { className: "pill proj", textContent: name });
  const color = projectColor(name);
  if (color) {
    const [r, g, b] = [1, 3, 5].map(i => parseInt(color.slice(i, i + 2), 16));
    tag.style.background = color;
    tag.style.color = (0.299 * r + 0.587 * g + 0.114 * b) > 160 ? "#172b4d" : "#fff";
  }
  return tag;
}

// a dot that shows and pulses while an agent's status entry points at the card
function workDot(c) {
  const d = Object.assign(document.createElement("span"),
    { className: "work", title: "an agent is working on it now" });
  d.dataset.id = c.id;
  markWorking(d);
  return d;
}

// blue when the card is on the base branch, purple when deployed; nothing when not
function statusDots(c) {
  return [["merged", "on the base branch: merged and pushed"],
          ["deployed", "deployed to the local test backend or device"]]
    .filter(([f]) => c[f])
    .map(([f, title]) => Object.assign(document.createElement("span"), { className: "st " + f, title }));
}

function markWorking(d) { d.classList.toggle("working", working.has(+d.dataset.id)); }

function cardNode(c) {
  const n = document.createElement("div");
  n.className = "card" + (selected.has(c.id) ? " selected" : "");
  n.draggable = true;
  n.dataset.id = c.id;
  const t = document.createElement("div");
  t.className = "t"; t.textContent = c.title;
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.append(Object.assign(document.createElement("span"),
    { className: "id", textContent: "#" + c.id }));
  if (c.assignee) meta.append(Object.assign(document.createElement("span"),
    { className: "pill who", textContent: c.assignee }));
  meta.prepend(workDot(c), ...statusDots(c));
  if (!proj()) meta.append(projectTag(c.project));   // under a project's tab, every card has it
  for (const l of c.labels) meta.append(Object.assign(document.createElement("span"),
    { className: "pill label", textContent: l }));
  if (c.checklist.length) meta.append(Object.assign(document.createElement("span"),
    { className: "pill checks",
      textContent: `☑ ${c.checklist.filter(i => i.done).length}/${c.checklist.length}` }));
  // computed by the server across projects, done cards left out; #37 reads them too.
  // A card optimistically dropped into done still carries its old lists: never mark it.
  const by = c.lane === "done" ? [] : c.blocked_by, blocks = c.lane === "done" ? [] : c.blocking;
  n.classList.toggle("blocked", by.length > 0);
  n.classList.toggle("blocking", blocks.length > 0);
  if (by.length) meta.append(Object.assign(document.createElement("span"),
    { className: "pill blocked-by", title: "blocked: can't start until these reach verify (with an open PR, or in a PR project with none: once merged) or done",
      textContent: "blocked by " + by.map(i => "#" + i).join(" ") }));
  if (blocks.length) meta.append(Object.assign(document.createElement("span"),
    { className: "pill blocks", title: "blocking: these cards wait for this one",
      textContent: "blocks " + blocks.map(i => "#" + i).join(" ") }));
  n.append(t, meta);

  n.ondragstart = ev => {
    ev.dataTransfer.setData("text/plain", String(c.id));
    ev.dataTransfer.effectAllowed = "move";
    n.classList.add("dragging");
  };
  n.ondragend = () => n.classList.remove("dragging");
  n.onclick = ev => {
    if (ev.ctrlKey || ev.metaKey) {
      selected.has(c.id) ? selected.delete(c.id) : selected.add(c.id);
      anchor = c.id;
    } else if (ev.shiftKey) {
      const mine = cards.filter(x => x.lane === c.lane);
      const a = mine.findIndex(x => x.id === anchor), b = mine.indexOf(c);
      if (a < 0) { selected.add(c.id); anchor = c.id; }
      else mine.slice(Math.min(a, b), Math.max(a, b) + 1).forEach(x => selected.add(x.id));
    } else {
      selected.clear();
      anchor = c.id;
      openCard(c.id);
    }
    renderBoard();
  };
  return n;
}

function renderBoard() {
  const b = $("#board");
  b.textContent = "";
  for (const id of selected) if (!cards.some(c => c.id === id)) selected.delete(id);
  for (const lane of LANES) {
    const col = document.createElement("div");
    col.className = "lane";
    col.dataset.lane = lane;
    // the column is the queue: top card first. Sorted here too, not only by the server,
    // so an optimistic local write lands in the right slot without a reload
    const mine = cards.filter(c => c.lane === lane).sort((a, b) => a.pos - b.pos || a.id - b.id);
    const h = document.createElement("h2");
    h.append(document.createTextNode(lane));
    if (lane === "done" && mine.length && !$("#showArch").checked)
      h.append(Object.assign(document.createElement("button"),
        { className: "arch", textContent: "archive all",
          title: "archive every card in done that the board shows (this project's only, if one is picked)",
          onclick: () => archive(mine.map(c => c.id)) }));
    h.append(Object.assign(document.createElement("span"), { textContent: mine.length }));
    col.append(h);
    mine.forEach(c => col.append(cardNode(c)));

    b.append(col);
  }
  drawLinks();
}

// The #37 arrows, redrawn from scratch: after every render and whenever the board resizes.
// Scrolling needs nothing: the svg lives in the board's own scroll coordinates.
// An end that isn't on screen (another project, done, archived) gets no arrow: the pill names it.
// ponytail: every card's rect read per draw, lane-skipping arrows scan the lanes between;
// fine for hundreds of cards.
const SVG = "http://www.w3.org/2000/svg";
let hotId = null;   // the hovered card's id
function drawLinks() {
  const b = $("#board");
  const old = $("#links");
  if (old) old.remove();   // first, so the old size doesn't hold the scroll size up
  const svg = document.createElementNS(SVG, "svg");
  svg.id = "links";
  svg.setAttribute("width", b.scrollWidth);
  svg.setAttribute("height", b.scrollHeight);
  // A slim notched head, tip on the card edge; it turns with the path's last 10 px, a
  // straight run into the edge (R), so it points along the line the eye sees (#64)
  svg.innerHTML = '<defs><marker id="head" viewBox="0 0 10 10" refX="10" refY="5" ' +
    'markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 L3,5 z"/></marker></defs>';
  const R = 10;
  const br = b.getBoundingClientRect();
  const rect = n => {   // in board coordinates
    const r = n.getBoundingClientRect();
    const left = r.left - br.left + b.scrollLeft, top = r.top - br.top + b.scrollTop;
    return { left, right: left + r.width, top, bottom: top + r.height, y: top + r.height / 2 };
  };
  const box = id => {   // a card on screen and not done
    const c = cards.find(x => x.id === id);
    const n = c && c.lane !== "done" && b.querySelector(`.card[data-id="${id}"]`);
    return n ? rect(n) : null;
  };
  const lanes = [...b.querySelectorAll(".lane")]
    .map(l => ({ ...rect(l), cards: [...l.querySelectorAll(".card")].map(rect) }));
  for (const c of cards) {
    const f = box(c.id);
    if (f) for (const to of c.blocking || []) {
      const t = box(to);
      if (!t) continue;
      let d;
      if (f.left === t.left) {   // same lane: out of the right edge and back in, a C into the gap
        d = `M${f.right},${f.y} C${f.right + 24},${f.y} ${t.right + 24},${t.y} ${t.right + R},${t.y} L${t.right},${t.y}`;
      } else {                   // across lanes: from the facing side to the facing side
        const s = t.left > f.left ? 1 : -1;
        const x1 = s > 0 ? f.right : f.left, x2 = s > 0 ? t.left : t.right, xr = x2 - s * R;
        const mid = lanes.filter(l => l.left > Math.min(f.right, t.right) && l.right < Math.max(f.left, t.left));
        if (!mid.length) {
          // no more than the span: past it the curve doubles back in x before the run
          const w = Math.abs(xr - x1), k = s * Math.min(w, Math.max(30, w / 2));
          d = `M${x1},${f.y} C${x1 + k},${f.y} ${xr - k},${t.y} ${xr},${t.y} L${x2},${t.y}`;
        } else {
          // Skipping lanes: under a card there it would seem to start from that card. Cross
          // them at the free height nearest both ends (in a gap between cards, above or below
          // them), jogging up or down in the lane gaps on either side.
          const busy = mid.flatMap(l => l.cards);
          const free = y => busy.every(r => y < r.top - 2 || y > r.bottom + 2);
          const cost = y => Math.abs(y - f.y) + Math.abs(y - t.y);
          const y = [f.y, t.y, ...busy.flatMap(r => [r.top - 4, r.bottom + 4])].filter(free)
            .reduce((a, z) => cost(z) < cost(a) ? z : a);
          const g1 = s > 0 ? mid[0].left : mid.at(-1).right, g2 = s > 0 ? mid.at(-1).right : mid[0].left;
          const h1 = (x1 + g1) / 2, h2 = (xr + g2) / 2;
          d = `M${x1},${f.y} C${h1},${f.y} ${h1},${y} ${g1},${y} L${g2},${y} C${h2},${y} ${h2},${t.y} ${xr},${t.y} L${x2},${t.y}`;
        }
      }
      const p = document.createElementNS(SVG, "path");
      p.setAttribute("d", d);
      p.setAttribute("marker-end", "url(#head)");
      p.dataset.from = c.id; p.dataset.to = to;
      p.classList.toggle("hot", p.dataset.from === hotId || p.dataset.to === hotId);
      svg.append(p);
    }
  }
  b.append(svg);
}
new ResizeObserver(drawLinks).observe($("#board"));
// hovering a card lights its arrows, both ways; a redraw under a still pointer keeps them lit
function hot(id) {
  hotId = id;
  for (const p of document.querySelectorAll("#links > path"))
    p.classList.toggle("hot", p.dataset.from === id || p.dataset.to === id);
}
$("#board").addEventListener("mouseover", ev => {
  const n = ev.target.closest(".card");
  hot(n && n.dataset.id);
});
$("#board").addEventListener("mouseleave", () => hot(null));

// A card drops into the column under the pointer, wherever on the page: below a lane's
// end, in the gap between lanes or on the status bar too. A lane is as tall as the tallest
// one, which leaves no room under the last card of a full lane, and the status bar covers
// the bottom of the window.
function laneAt(ev) {
  const hit = ev.target.closest && ev.target.closest(".lane");
  if (hit) return hit;
  let best = null, dist = Infinity;
  for (const col of document.querySelectorAll(".lane")) {
    const r = col.getBoundingClientRect();
    const d = Math.max(r.left - ev.clientX, ev.clientX - r.right, 0);
    if (d < dist) { dist = d; best = col; }
  }
  return best;
}
// Where in the column a drop lands: the first card whose middle is below the pointer,
// null for the end of the column. The dragged card is no landmark for itself.
function staying(col) { return [...col.querySelectorAll(".card:not(.dragging)")]; }
function dropBefore(col, y) {
  return staying(col).find(n => {
    const r = n.getBoundingClientRect();
    return r.top + r.height / 2 > y;
  }) || null;
}
// The pos values for n cards dropped there, spread evenly between the card above and the
// one below so a multi-card drop keeps its order instead of tying.
// ponytail: halving a gap runs out of float precision after ~50 drops into the same spot;
// renumber the lane if it ever shows up.
function slots(col, y, n) {
  const rest = staying(col);
  if (!rest.length) return [...Array(n).keys()];
  const at = i => cards.find(c => c.id === +rest[i].dataset.id).pos;
  const before = dropBefore(col, y);
  const k = before ? rest.indexOf(before) : rest.length;
  const hi = k < rest.length ? at(k) : at(rest.length - 1) + 1;
  const lo = k ? at(k - 1) : hi - 1;
  return [...Array(n).keys()].map(i => lo + (hi - lo) * (i + 1) / (n + 1));
}
function markOver(col, before) {
  for (const x of document.querySelectorAll(".lane.over")) if (x !== col) x.classList.remove("over");
  for (const x of document.querySelectorAll(".card.drop-at"))
    if (x !== before) x.classList.remove("drop-at");
  if (col) col.classList.add("over");
  if (before) before.classList.add("drop-at");
}
document.addEventListener("dragover", ev => {
  if (!$(".card.dragging")) return;   // a card's drag only, not text or files
  ev.preventDefault();
  const col = laneAt(ev);
  markOver(col, col && dropBefore(col, ev.clientY));
});
document.addEventListener("dragleave", ev => { if (!ev.relatedTarget) markOver(null); });
document.addEventListener("dragend", () => markOver(null));
document.addEventListener("drop", ev => {
  const col = $(".card.dragging") && laneAt(ev);
  markOver(null);
  if (!col) return;
  ev.preventDefault();
  const id = Number(ev.dataTransfer.getData("text/plain"));
  // a selected card takes the whole selection with it; any other card goes alone
  const ids = selected.has(id) ? [...selected] : [id];
  if (selected.has(id)) selected.clear();
  const at = slots(col, ev.clientY, ids.length);
  ids.forEach((i, k) => move(i, col.dataset.lane, at[k]));
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && !open && selected.size) { selected.clear(); renderBoard(); }
});

// One call for both gestures: to another lane, or up and down inside this one.
async function move(id, lane, pos) {
  const c = cards.find(x => x.id === id);
  if (!c || (c.lane === lane && c.pos === pos)) return;
  const was = { lane: c.lane, pos: c.pos };
  c.lane = lane; c.pos = pos;    // optimistic: the card lands where it was dropped
  renderBoard();
  try {
    replace(await api("PATCH", "/api/cards/" + id, { lane, pos }));
    if (open && open.id === id) openCard(id);
  } catch (e) {
    Object.assign(c, was);       // put it back where it came from
    renderBoard();
    showErr("could not move #" + id + ": " + e.message);
  }
}

// archived, not deleted: "show archived" brings them back
async function archive(ids) {
  try { await Promise.all(ids.map(id => api("PATCH", "/api/cards/" + id, { archived: true }))); }
  catch (e) { showErr("could not archive: " + e.message); }
  load();   // reload either way: some may have landed
}

// Responses can land out of order, so an older copy of a card must never replace a newer
// one already shown. Board fields all bump updated_at; links and comments do not, but
// every write appends an event, so for the panel the newest event id names the state.
// A write that changes this card's block marks changed the other end's too (#35): reload.
const marks = c => String(c.blocked_by) + "|" + String(c.blocking);
function replace(card) {
  const i = cards.findIndex(c => c.id === card.id);
  if (i >= 0 && card.updated_at >= cards[i].updated_at) {
    const ripple = marks(cards[i]) !== marks(card);
    cards[i] = card;
    if (ripple) return load();
  }
  renderBoard();
}

// ---------- detail panel ----------
async function openCard(id) {
  let card;
  try { card = await api("GET", "/api/cards/" + id); } catch (e) { return showErr(e.message); }
  if (stale(card)) return;
  open = card;
  renderPanel();
}

const lastEvent = c => c.events[c.events.length - 1].id;
const stale = card => open && open.id === card.id && lastEvent(card) < lastEvent(open);

function field(label, node) {
  const w = document.createElement("div");
  w.title = FIELD_TIPS[label] || "";
  w.append(Object.assign(document.createElement("h3"), { textContent: label }), node);
  return w;
}

// Open questions as core.number() leaves them: "N. question", then any options as indented
// "- option" bullets, one of them maybe suffixed " (recommended)".
function parseQuestions(text) {
  const out = [];
  for (const ln of (text || "").split("\n")) {
    let m = ln.match(/^(\d+)[.)]\s+(.*)/);
    if (m) { out.push({ n: +m[1], text: m[2].trim(), options: [] }); continue; }
    m = ln.match(/^\s+[-*+]\s+(.*)/);
    if (m && out.length) {
      const rec = /\s*\(recommended\)\s*$/i;
      out.at(-1).options.push({ text: m[1].replace(rec, "").trim(), recommended: rec.test(m[1]) });
    }
  }
  return out;
}

// The answers text with question n answered `text`: its top-level "n. " line replaced, or
// one added; every other line -- free text a person typed -- is kept.
function pickAnswer(answers, n, text) {
  const lines = answers ? answers.split("\n") : [];
  const at = lines.findIndex(l => new RegExp(`^${n}[.)]\\s`).test(l));
  if (at < 0) lines.push(`${n}. ${text}`); else lines[at] = `${n}. ${text}`;
  return lines.join("\n");
}

// One row of radios per question that offers options; a pick writes the answers field.
// Nothing is preselected: the recommended option only wears a badge.
function choices(c) {
  const picked = Object.fromEntries((c.answers || "").split("\n")
    .map(l => l.match(/^(\d+)[.)]\s+(.*)/)).filter(Boolean).map(m => [m[1], m[2].trim()]));
  return parseQuestions(c.questions).filter(q => q.options.length).map(q => {
    const row = Object.assign(document.createElement("div"),
      { className: "choice", title: `question ${q.n}: pick an answer, it goes into your answers below` });
    row.append(Object.assign(document.createElement("b"), { textContent: q.n + "." }));
    for (const o of q.options) {
      const r = Object.assign(document.createElement("input"),
        { type: "radio", name: "q" + q.n, checked: picked[q.n] === o.text });
      // from the box, not the card: it may hold text typed since the last save
      r.onchange = () => {
        const box = $("#panel textarea.answers");
        const answers = pickAnswer(box ? box.value : c.answers, q.n, o.text);
        if (box) box.value = answers;
        patch({ answers });
      };
      const l = document.createElement("label");
      l.append(r, " " + o.text);
      if (o.recommended)
        l.append(" ", Object.assign(document.createElement("span"), { className: "pill", textContent: "recommended" }));
      row.append(l);
    }
    return row;
  });
}

// Every edit is a PATCH; the response is the full card, so no follow-up GET.
async function patch(body) {
  if (!open.id) {
    // an unsaved card: edits stay local until "create". No re-render per field: leaving a
    // field is what fires its change, so a re-render would swap the create button out
    // from under the click that left it.
    Object.assign(open, body);
    if ("checklist" in body) renderPanel();   // the one edit that must show new nodes
    return;
  }
  const id = open.id;   // the panel can be closed while this PATCH is in flight
  try {
    const card = await api("PATCH", "/api/cards/" + id, body);
    replace(card);
    if (open && open.id === id && !stale(card)) { open = card; renderPanel(); }
  } catch (e) {
    showErr(e.message);
    if (open && open.id === id) renderPanel();
  }
}

// A field saves on `change`, which fires on the mousedown that leaves it, and the save's
// response re-renders the panel. Landing before mouseup, that swapped out the button under
// the pointer and the browser dropped the click (a person's click on "save" did nothing).
// So while a pointer is held, a panel render waits for its release -- and for the click
// that follows it, which is why the deferred render is a setTimeout, not in pointerup.
let pointerHeld = false, renderPending = false;
// Not on a <select>: its native popup can swallow the pointerup, which would leave every
// later render waiting, and a select is not a button a re-render can steal a click from.
addEventListener("pointerdown", e => { pointerHeld = e.target.tagName !== "SELECT"; }, true);
for (const ev of ["pointerup", "pointercancel", "dragend"])
  addEventListener(ev, () => {
    pointerHeld = false;
    if (renderPending) setTimeout(() => { renderPending = false; if (open) renderPanel(); });
  }, true);

let shown = null;    // which card the sheet currently holds, so a re-render can keep the comment box
let logOpen = false;   // the activity log's older half, expanded -- survives a re-render
const cardKey = c => typeof c === "string" ? c : c?.id ?? "draft";   // PROJECTS, SETTINGS

function hidePanel() { open = shown = null; $("#panel").classList.remove("on"); }

// "close" is the way out, and so is clicking outside the sheet: every field already
// saved on its own change. Closing blurs the field still focused, which fires its change -- the last
// edit saves too -- and text left in the comment box is posted rather than thrown away.
// A new card is created on the way out. Returns false when the sheet has to stay: a
// draft with things typed into it but no title, which cannot be created or discarded
// silently.
function closePanel() {
  const c = open;
  if (!c) return true;
  document.activeElement?.blur();   // a draft's change lands synchronously, a card's PATCHes
  if (c === PROJECTS || c === SETTINGS) { hidePanel(); return true; }
  if (c.id) {
    const typed = ($("#panel .say-box")?.value || "").trim();
    hidePanel();
    if (typed) api("POST", `/api/cards/${c.id}/comment`, { text: typed })
      .then(replace, e => showErr(e.message));
    return true;
  }
  if (!c.title.trim()) {
    if (!c.description.trim() && !c.labels.length && !c.checklist.length
        && !c.links.length) { hidePanel(); return true; }   // nothing to keep
    showErr("a card needs a title — give it one, or cancel to throw it away");
    $("#panel input[type=text]").focus();
    return false;
  }
  if (!c.creating) createDraft(c);   // a second click must not make two cards
  return true;
}

async function createDraft(c) {
  c.creating = true;
  const { events, links, creating, ...fields } = c;
  let card;
  try {
    card = await api("POST", "/api/cards", { ...fields, title: c.title.trim() });
  } catch (e) {   // the sheet is still open with everything in it: fix and click out again
    c.creating = false;
    return showErr(e.message);
  }
  try {   // the card exists now, so a failure below is reported, not retried as a create
    for (const l of links)
      await api("POST", "/api/links", { from_id: card.id, to_id: l.to_id, kind: l.kind });
  } catch (e) { showErr(`#${card.id} was created, but: ${e.message}`); }
  $("#showArch").checked = false;   // a new card is active: show the board it landed on
  if (proj() && proj().toLowerCase() !== card.project.toLowerCase())
    localStorage.setItem("project", card.project);   // and the project it landed in
  if (open === c) hidePanel();      // unless cancelled or switched meanwhile
  await load();
}

// Capture phase, so the sheet closes before the click reaches what it landed on: a card
// on the board then opens in its place, and "New Card" opens a fresh draft. A draft that
// must stay open swallows the click, so it cannot be replaced out from under the person.
// The error bar and the delete-project dialog sit outside the sheet but belong to it.
addEventListener("click", e => {
  if (!open || $("#panel").contains(e.target) || e.target.closest("#err, #delProject")) return;
  if (!closePanel()) { e.stopPropagation(); e.preventDefault(); }
}, true);

function renderPanel() {
  if (pointerHeld) { renderPending = true; return; }
  const p = $("#panel");
  // a re-render must not eat a half-typed comment -- but a different card gets its own box
  const typed = shown === cardKey(open) ? ($("#panel .say-box")?.value || "") : "";
  if (shown !== cardKey(open)) logOpen = false;   // another card opens folded again
  shown = cardKey(open);
  p.textContent = "";
  p.classList.add("on");
  const c = open;
  const dismiss = hidePanel;
  if (c === PROJECTS) return renderProjects(p, dismiss);
  if (c === SETTINGS) return renderSettings(p, dismiss);

  // closing saves: a card's pending edit and comment land, a draft is created
  const shut = Object.assign(document.createElement("button"),
    { className: "close primary shut", textContent: "close" });
  shut.onclick = () => closePanel();
  const title = Object.assign(document.createElement("input"),
    { type: "text", value: c.title, placeholder: "what needs doing?", title: FIELD_TIPS.title });
  title.onchange = () => patch({ title: title.value });
  title.onkeydown = ev => { if (!c.id && ev.key === "Enter") closePanel(); };
  const head = Object.assign(document.createElement("div"), { className: "head" });
  p.append(head);

  if (c.id) {
    // archiving takes the card out of the current view (active or archived), so reload and close
    const arch = Object.assign(document.createElement("button"),
      { className: "close", textContent: c.archived ? "unarchive" : "archive",
        title: c.archived ? "put the card back on the board"
                          : "take the card off the board, without deleting it" });
    arch.onclick = async () => {
      try {
        await api("PATCH", "/api/cards/" + c.id, { archived: !c.archived });
        dismiss();
        load();
      } catch (e) { showErr(e.message); }
    };
    // verify is the last lane a person acts on: one click ends the card
    const fin = c.lane === "verify" ? Object.assign(document.createElement("button"),
      { className: "close", textContent: "move to done",
        title: "the card is verified: move it to done" }) : null;
    if (fin) fin.onclick = () => patch({ lane: "done" });
    const idSpan = Object.assign(document.createElement("span"), { className: "id", textContent: "#" + c.id });
    idSpan.prepend(workDot(c), ...statusDots(c));
    head.append(idSpan, title, arch, ...(fin ? [fin] : []), shut);
    // project and lane are fields of their own on the sheet: this line says only who made it, when
    const sub = Object.assign(document.createElement("div"), { className: "sub" });
    sub.append(Object.assign(document.createElement("span"),
                 { textContent: "created " + ago(c.created_at),
                   title: new Date(c.created_at).toLocaleString() }),
               " by " + c.created_by);
    // the session that last worked the card: its transcript is one `claude --resume` away
    if (c.session) {
      const label = "session " + c.session.slice(0, 8);
      const ses = Object.assign(document.createElement("button"),
        { className: "ses", textContent: label,
          title: "Copy the command that reopens the session that worked this card" });
      ses.onclick = async () => {
        try {
          await navigator.clipboard.writeText("claude --resume " + c.session);
          ses.textContent = "copied";
          setTimeout(() => { ses.textContent = label; }, 1500);
        } catch (e) { showErr("could not copy: " + e.message); }
      };
      sub.append(" · ", ses);
    }
    // only a web address becomes a link: a javascript: one would run on click
    if (/^https?:\/\//i.test(c.pr))
      sub.append(" · ", Object.assign(document.createElement("a"),
        { className: "pr", href: c.pr, target: "_blank", rel: "noopener",
          textContent: "pull request", title: "Open this card's pull request" }));
    p.append(sub);
  } else {
    // a draft has no other way out: cancel throws it away, dropping what is typed
    const cancel = Object.assign(document.createElement("button"),
      { className: "close", textContent: "cancel", title: "throw this new card away" });
    // keep focus in the field: a mousedown here would blur it, and the blur's change saves it
    cancel.onmousedown = e => e.preventDefault();
    cancel.onclick = () => {
      const a = document.activeElement;
      if (a && p.contains(a)) a.onchange = null;   // hiding the sheet blurs it: that must not save
      dismiss();
    };
    head.append(Object.assign(document.createElement("span"), { className: "id", textContent: "new" }),
                title, cancel, shut);
    p.append(Object.assign(document.createElement("div"),
      { className: "sub", textContent: `new card · ${c.project} · created when you close it` }));
  }

  const pj = document.createElement("select");
  for (const x of projects)   // a card from before projects may spell its project differently
    pj.append(new Option(x.name, x.name, false, x.name.toLowerCase() === c.project.toLowerCase()));
  pj.onchange = () => patch({ project: pj.value });
  p.append(field("project", pj));

  const desc = Object.assign(document.createElement("textarea"),
    { value: c.description, className: "desc" });
  desc.onchange = () => patch({ description: desc.value });
  p.append(field("description", desc));

  // the comments come right under the description (#95): the log with them, then the box.
  // A card that does not exist yet has no comments, so a draft shows neither (#94).
  if (c.id) {
    p.append(field("activity", renderLog(c.events)));

    const say = Object.assign(document.createElement("textarea"),
      { className: "say-box", placeholder: "comment… (ctrl+enter to send)" });
    say.value = typed;
    const send = Object.assign(document.createElement("button"),
      { className: "primary", textContent: "comment" });
    const post = async () => {
      if (!say.value.trim()) return;
      try {
        const card = await api("POST", `/api/cards/${c.id}/comment`, { text: say.value.trim() });
        replace(card);
        if (open?.id !== card.id || stale(card)) return;   // closed or switched meanwhile
        open = card;
        say.value = "";
        renderPanel();
      } catch (e) { showErr(e.message); }
    };
    send.onclick = post;
    say.onkeydown = ev => { if (ev.key === "Enter" && (ev.ctrlKey || ev.metaKey)) post(); };
    const cw = document.createElement("div");
    cw.append(say, send);
    p.append(field("say something", cw));
  }

  // the planning round, each in its own box, shown only once it holds something (#96):
  // the agent writes plan and questions; a person answers, so answers show with questions
  const shows = { plan: c.plan, questions: c.questions, answers: c.questions || c.answers };
  for (const [f, label] of [["plan", "plan"], ["questions", "open questions"],
                            ["answers", "your answers"]]) {
    if (!shows[f]) continue;
    const box = Object.assign(document.createElement("textarea"),
      { value: c[f], className: f === "plan" ? f : "desc " + f });
    box.onchange = () => patch({ [f]: box.value });
    p.append(field(label, box));
    if (f === "questions") p.append(...choices(c));
  }

  const row = document.createElement("div");
  row.className = "row";

  const asg = document.createElement("select");
  asg.append(new Option("— nobody —", "", false, !c.assignee));
  for (const u of users) asg.append(new Option(u, u, false, u === c.assignee));
  if (c.assignee && !users.includes(c.assignee))
    asg.append(new Option(c.assignee, c.assignee, false, true));
  asg.onchange = () => patch({ assignee: asg.value || null });

  const lane = document.createElement("select");
  for (const v of LANES) lane.append(new Option(v, v, false, v === c.lane));
  lane.onchange = () => patch({ lane: lane.value });

  for (const [name, node] of [["assignee", asg], ["lane", lane]]) {
    const w = field(name, node);
    w.style.flex = "1 1 45%";
    row.append(w);
  }
  p.append(row);

  const labels = Object.assign(document.createElement("input"),
    { type: "text", value: c.labels.join(", "), placeholder: "comma, separated" });
  labels.onchange = () => patch({
    labels: labels.value.split(",").map(s => s.trim()).filter(Boolean) });
  p.append(field("labels", labels));

  // checklist: PATCH replaces the whole list, so send every item back with one flag flipped
  const list = document.createElement("div");
  c.checklist.forEach((item, i) => {
    const l = document.createElement("label");
    l.className = "chk" + (item.done ? " done" : "");
    const box = Object.assign(document.createElement("input"),
      { type: "checkbox", checked: item.done });
    box.onchange = () => patch({
      checklist: c.checklist.map((it, j) => j === i ? { ...it, done: box.checked } : it) });
    l.append(box, Object.assign(document.createElement("span"), { textContent: item.text }));
    list.append(l);
  });
  const addItem = Object.assign(document.createElement("input"),
    { type: "text", placeholder: "+ checklist item (enter)" });
  addItem.onkeydown = ev => {
    if (ev.key === "Enter" && addItem.value.trim())
      patch({ checklist: [...c.checklist, { text: addItem.value.trim(), done: false }] });
  };
  list.append(addItem);
  // from plan on the agent writes the checklist from the plan's steps: an empty one shows
  // only while a person is writing the card (a draft, or todo) (#96)
  if (c.checklist.length || !c.id || c.lane === "todo") p.append(field("checklist", list));
  // Links cannot be written before the card exists, so a draft holds them and "create"
  // sends them after it.
  const links = document.createElement("ul");
  links.className = "links";
  for (const l of c.links) {
    const li = document.createElement("li");
    const other = !c.id || l.from_id === c.id ? `→ #${l.to_id}` : `← #${l.from_id}`;
    li.append(document.createTextNode(`${l.kind} ${other}`));
    const rm = Object.assign(document.createElement("button"), { textContent: "unlink" });
    rm.onclick = async () => {
      if (!c.id) { c.links = c.links.filter(x => x !== l); return renderPanel(); }
      try {
        await api("DELETE", "/api/links",
                  { from_id: l.from_id, to_id: l.to_id, kind: l.kind });
        openCard(c.id);
        if (l.kind === "blocks") load();   // both ends' marks change
      } catch (e) { showErr(e.message); }
    };
    li.append(rm);
    links.append(li);
  }
  const lk = document.createElement("div");
  lk.className = "row";
  const lid = Object.assign(document.createElement("input"),
    { type: "number", placeholder: "card #", style: "width:80px" });
  const lkind = document.createElement("select");
  for (const k of ["parent", "blocks"]) lkind.append(new Option(k, k));
  const lgo = Object.assign(document.createElement("button"), { textContent: "link" });
  lgo.onclick = async () => {
    if (!c.id) {
      const to = Number(lid.value);
      try { await api("GET", "/api/cards/" + to); }   // refuse a bad link now, not after create
      catch (e) { return showErr(e.message); }
      if (open !== c) return;
      if (!c.links.some(l => l.to_id === to && l.kind === lkind.value))
        c.links.push({ to_id: to, kind: lkind.value });
      return renderPanel();
    }
    try {
      await api("POST", "/api/links",
                { from_id: c.id, to_id: Number(lid.value), kind: lkind.value });
      openCard(c.id);
      if (lkind.value === "blocks") load();   // both ends' marks change
    } catch (e) { showErr(e.message); }
  };
  lk.append(document.createTextNode("this is a "), lkind,
            document.createTextNode(" of "), lid, lgo);
  links.append(lk);
  p.append(field("links", links));
  if (!c.id) title.focus();
}

// ---------- header controls ----------
// One tab per project after "All"; a remembered project that is gone keeps its tab while
// it is the one picked. A tab's value is the project's name, "" for All.
function renderProj() {
  const names = ["", ...projects.map(p => p.name)];
  if (!names.includes(proj())) names.push(proj());
  $("#proj").replaceChildren(...names.map(n => {
    const b = Object.assign(document.createElement("button"),
      { type: "button", value: n, textContent: n || "All" });
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", n === proj());
    const color = n && projectColor(n);
    const dot = Object.assign(document.createElement("span"), { className: color ? "dot" : "dot idle" });
    if (color) dot.style.background = color;
    b.prepend(dot);
    markTab(b);
    b.onclick = () => { localStorage.setItem("project", n); load(); };
    return b;
  }));
  // A narrow window scrolls the strip: bring the picked tab into view when the pick
  // changes. Only the strip scrolls (scrollIntoView would move the page too, on every
  // reload), and an unchanged pick leaves where the person scrolled it alone.
  if (shownProj === proj()) return;
  shownProj = proj();
  const strip = $("#proj"), t = $("#proj [aria-selected=true]");
  if (t.offsetLeft < strip.scrollLeft || t.offsetLeft + t.offsetWidth > strip.scrollLeft + strip.clientWidth)
    strip.scrollLeft = t.offsetLeft - 8;
}
let shownProj = null;   // the pick the strip was last scrolled to

// ---------- project settings ----------
// Each field saves on change, like a card's. A successful save does not re-render: the
// input already shows the value, and a re-render would swap out whatever button the
// click that left the field is landing on. Only a failure re-renders, to show what the
// server actually holds.
function renderProjects(p, dismiss) {
  const done = Object.assign(document.createElement("button"),
    { className: "close primary shut", textContent: "done" });
  done.onclick = () => { document.activeElement?.blur(); dismiss(); };
  p.append(done, Object.assign(document.createElement("div"),
    { className: "sub", textContent: "projects · every card belongs to one" }));

  const inputs = (x = {}) => ({
    name: Object.assign(document.createElement("input"),
      { type: "text", value: x.name || "", placeholder: "name" }),
    path: Object.assign(document.createElement("input"),
      { type: "text", value: x.path || "", placeholder: "folder, e.g. D:\\source\\tickets (optional)" }),
    instructions: Object.assign(document.createElement("textarea"),
      { value: x.instructions || "", placeholder: "instructions for agents working on this project (optional)" }),
    // a new project's picker starts black and means "pick one for me" until touched
    color: Object.assign(document.createElement("input"),
      { type: "color", value: x.color || "#000000", title: "the color its cards are tagged with" }),
    land: landPicker(x.land),
  });
  const block = (label, f, extra) => {
    const w = document.createElement("div");
    w.className = "project";
    w.append(Object.assign(document.createElement("h3"), { textContent: label }),
             f.name, f.path, f.instructions, f.color, f.land, ...(extra ? [extra] : []));
    p.append(w);
  };

  for (const x of projects) {
    const f = inputs(x);
    let name = x.name;   // follows a rename, so later edits address the new name
    for (const [key, el] of Object.entries(f)) {
      el.onchange = async () => {
        try {
          const saved = await api("PATCH", "/api/projects/" + encodeURIComponent(name),
                                  { [key]: el.value });
          if (key === "name") {
            if (proj().toLowerCase() === name.toLowerCase())
              localStorage.setItem("project", saved.name);   // the filter follows the rename
            name = saved.name;
          }
          el.value = saved[key];   // as stored: trimmed
          await load();            // the filter list and every card's project name
        } catch (e) {
          showErr(e.message);
          await load();
          if (open === PROJECTS) renderPanel();
        }
      };
    }
    const del = Object.assign(document.createElement("button"),
      { className: "danger", textContent: "delete project…" });
    del.onclick = () => confirmDelete(name);
    block(x.name, f, x.name.toLowerCase() === NO_PROJECT.toLowerCase() ? null : del);
  }

  const f = inputs();
  let picked = false;
  f.color.oninput = () => { picked = true; };
  const add = Object.assign(document.createElement("button"),
    { className: "primary", textContent: "add project" });
  add.onclick = async () => {
    try {
      await api("POST", "/api/projects", { name: f.name.value, path: f.path.value,
                                           instructions: f.instructions.value,
                                           color: picked ? f.color.value : "",
                                           land: f.land.value });
      await load();
      if (open === PROJECTS) renderPanel();
    } catch (e) { showErr(e.message); }   // the typed values stay for a retry
  };
  block("new project", f, add);
}

// core.LANDS: how a card that passed its tests lands
function landPicker(land = "merge") {
  const s = Object.assign(document.createElement("select"), { className: "land",
    title: "How a card that passed its tests lands: merged locally into the base branch, or as a pull request" });
  for (const [v, t] of [["merge", "merge into the base branch"], ["pr", "open a pull request"]])
    s.append(new Option(t, v, false, v === land));
  return s;
}

const NO_PROJECT = "No Project";   // core.NO_PROJECT: where a deleted project's cards go

// Deleting is the one project change that cannot be undone, so it spells out what happens
// to the cards and waits for an explicit "Delete project". Esc or Cancel does nothing.
async function confirmDelete(name) {
  let active, archived;
  try {
    const q = "/api/cards?project=" + encodeURIComponent(name);
    [active, archived] = (await Promise.all([api("GET", q), api("GET", q + "&archived=1")]))
      .map(list => list.length);
  } catch (e) { return showErr(e.message); }
  const n = active + archived;
  $("#delTitle").textContent = `Delete project “${name}”?`;
  $("#delMsg").textContent = n === 0 ? "It has no cards. " : (
      `Its ${n} card${n === 1 ? "" : "s"}${archived ? ` (${archived} archived)` : ""} will move ` +
      `to “${NO_PROJECT}”, where agents will not work on them. `) +
    "Its folder, instructions and color are forgotten; nothing on disk is touched. " +
    "This cannot be undone.";
  const d = $("#delProject");
  d.returnValue = "";
  d.onclose = async () => {
    if (d.returnValue !== "delete") return;
    try {
      await api("DELETE", "/api/projects/" + encodeURIComponent(name));
      if (proj().toLowerCase() === name.toLowerCase()) localStorage.setItem("project", "");
      await load();
      if (open === PROJECTS) renderPanel();
    } catch (e) { showErr(e.message); }
  };
  d.showModal();
}

$("#projects").onclick = () => { open = PROJECTS; renderPanel(); };

// ---------- board settings ----------
// One so far: host the board on the LAN. The bind address changes only with a backend
// restart, which the server starts itself when it can (restart-backend.ps1 -Delay 2); the
// sheet then waits for the backend to come back on the new address. 127.0.0.1 keeps
// answering either way, so a board opened here survives the restart.
let settings = null;      // GET /api/settings, as of the last answer
let restarting = false;   // the server said it is restarting onto the new address
let leftLan = false;      // this LAN device turned LAN hosting off: it is about to lose the board
const LOCAL_PAGE = ["127.0.0.1", "localhost", "[::1]"].includes(location.hostname);

async function openSettings() {
  try { settings = await api("GET", "/api/settings"); } catch (e) { return showErr(e.message); }
  open = SETTINGS;
  renderPanel();
}

function lanState(s) {
  const say = text => Object.assign(document.createElement("p"), { className: "state sub", textContent: text });
  if (leftLan)
    return [say("the backend is going back to this computer only, so this device loses the board: " +
                "open it on that computer at http://127.0.0.1:" + s.port + "/")];
  if (restarting) return [say("restarting the backend on the new address…")];
  if (s.bound === null)
    return [say("this backend was not started from uvicorn's command line, so it does not know " +
                "its address and cannot restart itself: the change applies the next time it is " +
                "started with restart-backend.ps1")];
  if (s.pending && s.restart_failed)
    return [say("the backend tried to restart itself onto the new address and did not (see " +
                "restart-backend.log): run powershell -NoProfile -File restart-backend.ps1, or " +
                "untick and tick again to retry")];
  if (s.pending)
    return [say("restart the backend to apply it: powershell -NoProfile -File restart-backend.ps1 " +
                "(not on Windows: start uvicorn with --host " +
                (s.lan ? "0.0.0.0" : "127.0.0.1") + ")")];
  if (!s.listening_lan) return [say(`listening on ${s.bound} only: this computer`)];
  const list = document.createElement("ul");
  for (const u of s.urls) {
    const li = document.createElement("li");
    li.append(Object.assign(document.createElement("a"), { href: u, textContent: u, target: "_blank" }));
    list.append(li);
  }
  return s.urls.length
    ? [say(`listening on every address (${s.bound}): open the board from another device at`), list,
       say("no answer there? Windows firewall may be blocking it: see the docs, On your LAN")]
    : [say(`listening on every address (${s.bound}), but this computer has no LAN address right now`)];
}

function renderSettings(p, dismiss) {
  const done = Object.assign(document.createElement("button"),
    { className: "close primary shut", textContent: "done" });
  done.onclick = dismiss;
  p.append(done, Object.assign(document.createElement("div"),
    { className: "sub", textContent: "settings · for the whole board" }));
  const w = document.createElement("div");
  w.className = "setting";
  const box = Object.assign(document.createElement("input"),
    { type: "checkbox", id: "lan", checked: settings.lan, disabled: restarting || leftLan });
  const label = Object.assign(document.createElement("label"), { className: "chk" });
  label.append(box, Object.assign(document.createElement("span"),
    { textContent: "host the board on the LAN" }));
  box.onchange = async () => {
    try {
      settings = await api("PATCH", "/api/settings", { lan: box.checked });
      // a device that reached the board over the LAN cannot follow it back to 127.0.0.1:
      // polling would only end in a false "did not come back"
      if (settings.restarting && !settings.lan && !LOCAL_PAGE) leftLan = true;
      else if (settings.restarting) waitForRestart();
    } catch (e) { showErr(e.message); }
    if (open === SETTINGS) renderPanel();
  };
  w.append(Object.assign(document.createElement("h3"), { textContent: "network" }), label,
    Object.assign(document.createElement("p"), { className: "warn",
      textContent: "On, other devices on your network can open the board at this computer's " +
        "address. There is no password: anyone on the network can read and change every " +
        "card. Agents on this computer keep using 127.0.0.1." }),
    ...lanState(settings));
  p.append(w);
}

// The old backend answers for about 2 s more, then nothing does, then the new one does.
// Done when an answer no longer says the setting is pending, or says the restart failed
// (the old backend still answering well after it should have gone); give up after a minute.
// The last answer stays, so the sheet then says which.
async function waitForRestart() {
  restarting = true;
  const end = Date.now() + 60000;
  while (Date.now() < end) {
    await new Promise(r => setTimeout(r, 1000));
    try {
      const s = await api("GET", "/api/settings");
      settings = s;
      if (!s.pending || s.restart_failed) break;
    } catch { /* down mid-restart */ }
  }
  if (settings.pending)
    showErr("the backend did not come back on the new address: see restart-backend.log");
  restarting = false;
  if (open === SETTINGS) renderPanel();
}

$("#settings").onclick = openSettings;

$("#showArch").onchange = () => load();

// Opens the panel on an unsaved card; nothing is written until its "create" button.
$("#add").onclick = () => {
  if (!projects.length) {   // every card belongs to a project, and there is none yet
    showErr("create a project first — every card belongs to one");
    open = PROJECTS;
    renderPanel();
    return $("#panel .project:last-child input").focus();
  }
  // the current tab's project; under All (or a stale tab) the first project in tab order
  const find = n => projects.find(p => p.name.toLowerCase() === (n || "").toLowerCase());
  const home = find(proj());
  open = { title: "", description: "", lane: "todo", assignee: null,
           labels: [], checklist: [], project: (home || projects[0]).name,
           events: [], links: [] };
  renderPanel();
};

// Loads can be answered out of order (a poll's reload and a write's, say): an answer that
// arrives after a newer load started is older than what that load will show, so it is
// dropped, and its caller waits for the newest load instead -- whoever renders after
// `await load()` still sees the fresh board (#88).
let loads = 0, loading = null;
function load() { return loading = loadBoard(++loads); }
async function loadBoard(call) {
  let got;
  try {
    const q = new URLSearchParams();
    if (proj()) q.set("project", proj());
    if ($("#showArch").checked) q.set("archived", "1");
    got = await Promise.all([
      api("GET", "/api/cards?" + q), api("GET", "/api/users"), api("GET", "/api/projects"),
    ]);
  } catch (e) {
    if (call !== loads) return loading;
    return showErr("could not load the board: " + e.message);
  }
  if (call !== loads) return loading;
  [cards, users, projects] = got;
  renderProj();
  renderBoard();
}

// ---------- status bar: what agents are doing right now ----------
let busy = null;   // card ids agents were working on at the last poll
let working = new Set();   // the same ids, for the pulsing dots
let workingProjects = new Set();   // their projects, lowercased, for the pulsing tab dots

// A tab's dot pulses while an agent works a card in its project; "All" while any agent works.
function markTab(b) {
  const dot = b.querySelector(".dot");
  if (!dot) return;
  const lit = b.value ? workingProjects.has(b.value.toLowerCase()) : working.size > 0;
  dot.classList.toggle("working", lit);
  if (lit) dot.title = b.value ? "an agent is working on a card in this project" : "an agent is working on a card";
  else dot.removeAttribute("title");
}
let version = null;   // the newest event id at the last poll: every card write bumps it
let recheck = false;   // the open card may be behind: refresh the sheet when it is safe to

let statusCall = 0;
async function loadStatus() {
  const bar = $("#status"), call = ++statusCall;
  let jobs, ver;
  try {
    [jobs, ver] = await Promise.all([api("GET", "/api/activity"), api("GET", "/api/version")]);
  } catch { if (call === statusCall) bar.textContent = "agent status unavailable"; return; }
  // a poll that started before a newer call must not undo what that call showed
  if (call !== statusCall) return;
  bar.textContent = jobs.length ? "" : "no agent is working on anything";
  for (const j of jobs) {
    const n = document.createElement("span");
    n.className = "job";
    n.title = `${j.project} · ${j.lane}: click to open the card`;
    n.append(Object.assign(document.createElement("span"), { className: "dot" }),
             Object.assign(document.createElement("span"), { className: "who", textContent: j.actor }),
             " " + j.doing + " ",
             Object.assign(document.createElement("span"), { className: "id", textContent: "#" + j.card_id }),
             " ",
             Object.assign(document.createElement("span"), { className: "t", textContent: j.title }),
             " · started " + ago(j.since));
    n.onclick = () => openCard(j.card_id);
    bar.append(n);
  }
  // set before any reload, so the rebuilt cards pulse too; the open editor is updated in place
  working = new Set(jobs.map(j => j.card_id));
  for (const d of document.querySelectorAll(".work[data-id]")) markWorking(d);
  workingProjects = new Set(jobs.map(j => (j.project || "").toLowerCase()));
  for (const b of document.querySelectorAll("#proj button")) markTab(b);
  // a dot lit or put out can wrap a card's meta row and move the cards under it
  if (jobs.map(j => j.card_id).join() !== busy) drawLinks();
  // An agent finishing moves its card, and anyone's write bumps the version (a card the
  // agent creates, a move, a comment): reload the board then, once, but never under a drag.
  // A version change seen while a pointer is held is not recorded, so the next poll retries.
  const now = jobs.map(j => j.card_id).join();
  const dragging = !!$(".card.dragging");
  const finished = busy !== null && now !== busy && !dragging;
  const changed = version !== null && ver.event !== version && !dragging && !pointerHeld;
  if (finished || changed) load();
  if (changed) recheck = true;
  if (version === null || changed) version = ver.event;
  busy = now;
  refreshOpen();
}

// Someone else wrote, and the open card may be what changed. The sheet re-renders only
// when it is behind, never over a field being typed in (that waits for the next poll),
// and through the same stale() check as every other response.
async function refreshOpen() {
  if (!recheck) return;
  if (!open?.id) { recheck = false; return; }   // a draft or the project settings
  if ($("#panel :is(input:not([type=checkbox]), textarea):focus")) return;
  recheck = false;
  const id = open.id;
  let card;
  try { card = await api("GET", "/api/cards/" + id); } catch { return; }
  if (open?.id === id && lastEvent(card) > lastEvent(open)) { open = card; renderPanel(); }
}

// ---------- hover help: every control says what it is ----------
const FIELD_TIPS = {
  "title": "what needs doing, in a line",
  "project": "the project this card belongs to: the agent works in that project's folder",
  "description": "the request: what you want done and why. The agent reads it, never rewrites it",
  "plan": "the implementation plan the planning agent wrote. Edit it if you want it done differently",
  "open questions": "what the plan needs a person to decide before the work can go on",
  "your answers": "your answers to the open questions: the agent reads them when it replans",
  "assignee": "who is working on it: a person, or an agent while it works",
  "lane": "the stage it is in: todo → plan → develop → test → verify → done",
  "labels": "free tags, comma separated",
  "checklist": "steps to tick off; the card shows done/total",
  "links": "relate this card to another: a parent, or a card this one blocks",
  "activity": "everything that happened to the card, and who did it",
  "say something": "a comment on the card, logged with your name; ctrl+enter sends it",
};
const LANE_TIPS = {
  todo: "backlog: not started. Move a card on to plan to start it",
  plan: "the agent writes a plan and any open questions",
  develop: "the agent builds it, following the plan and your answers",
  test: "the agent reviews the changes and runs the tests",
  verify: "the agent is done: a person checks the result",
  done: "finished: nothing more happens to it",
};
// [selector, tip]: applied to whatever is on the page, including everything rendered
// later, and never over a title an element already has (those are more specific)
const TIPS = [
  ["header h1", "the board: cards move left to right through the lanes"],
  ['#proj [value=""]', "show every project's cards"],
  ["#proj button", "show only this project's cards"],
  ["#projects", "set up projects: name, folder the agent works in, agent instructions, color"],
  ["#settings", "board settings: host the board on the LAN"],
  ["#panel label:has(#lan)", "let other devices on your network open the board; the backend restarts onto the new address"],
  ["label:has(#showArch)", "show archived cards instead of the ones on the board"],
  ["#add", "create a new card"],
  ["#docs", "how the board and the agent work, and how to use them"],
  ...LANES.map(l => [`.lane[data-lane="${l}"] h2`, LANE_TIPS[l]]),
  [".card .id", "the card's number"],
  [".card .pill.who", "assigned to"],
  [".card .pill.proj", "project"],
  [".card .pill.label", "label"],
  [".card .pill.checks", "checklist items done / total"],
  [".card", "click to open, drag to another lane to move it, or up and down to reorder — an agent takes the top card of a column; ctrl/shift-click to select several, then drag one of them to move them all"],
  ["#status", "what agents are doing right now"],
  ["#panel .shut", "close the sheet: every field saved as you changed it, and what you are still typing saves now too"],
  [".log .cli summary", "what claude printed while it worked on this card"],
  ["#panel .project input[type=text]:first-of-type", "the project's name, as cards show it"],
  ["#panel .project input[type=text]:nth-of-type(2)", "the folder the agent works in for this project's cards"],
  ["#panel .project textarea", "board-specific extras for this project's agents, e.g. the deploy target; the repo's CLAUDE.md holds its rules"],
  ["#panel .project .danger", "delete the project: its cards move to No Project, where agents leave them alone"],
  ["#panel .project .primary", "create the project"],
  ["#delProject button[value=cancel]", "keep the project"],
  ["#delProject button[value=delete]", "delete the project for good"],
];
function applyTips() {
  for (const [sel, tip] of TIPS)
    for (const el of document.querySelectorAll(sel)) if (!el.title) el.title = tip;
}
new MutationObserver(applyTips).observe(document.body, { childList: true, subtree: true });
applyTips();

load();
loadStatus();
setInterval(loadStatus, 5000);
</script>
</body>
</html>
